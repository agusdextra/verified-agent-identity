
name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Nama agen yang akan diverifikasi'
        required: true
        default: 'agus sarjono'
      agent_description:
        description: 'Deskripsi agen'
        required: true
        default: 'asclaw AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity
      
      - name: Install script dependencies
        working-directory: ./scripts
        run: npm ci
      
 - name: Link Human to Agent
  run: |
    node scripts/manualLinkHumanToAgent.js --challenge '{
      "name": "agus-sarjono",
      "description": "${{ inputs.agent_description }}"
    }'
